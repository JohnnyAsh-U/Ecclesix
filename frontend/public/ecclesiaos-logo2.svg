<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Inter:wght@300;400&amp;display=swap');
    </style>

    <!-- Deep navy to rich indigo gradient for icon -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B2E5E"/>
      <stop offset="100%" style="stop-color:#2D4BA0"/>
    </linearGradient>

    <!-- Gold shimmer gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9972A"/>
      <stop offset="50%" style="stop-color:#F0C040"/>
      <stop offset="100%" style="stop-color:#C9972A"/>
    </linearGradient>

    <!-- Subtle glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow for icon -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1B2E5E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ── ICON MARK ── -->
  <!-- Rounded square background -->
  <rect x="8" y="8" width="132" height="144" rx="22" ry="22" fill="url(#iconGrad)" filter="url(#shadow)"/>

  <!-- Arch / pediment — top of church -->
  <path d="M74 28 L38 62 L110 62 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Steeple cross on apex -->
  <line x1="74" y1="18" x2="74" y2="34" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68" y1="24" x2="80" y2="24" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Church body / columns -->
  <rect x="42" y="62" width="64" height="52" rx="2" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Central door arch -->
  <path d="M62 114 L62 88 Q74 78 86 88 L86 114" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Two windows (circular rose windows) -->
  <circle cx="52" cy="80" r="5" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <circle cx="96" cy="80" r="5" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <!-- Window cross details -->
  <line x1="52" y1="76" x2="52" y2="84" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round"/>
  <line x1="48" y1="80" x2="56" y2="80" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round"/>
  <line x1="96" y1="76" x2="96" y2="84" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round"/>
  <line x1="92" y1="80" x2="100" y2="80" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round"/>

  <!-- Base / steps -->
  <rect x="34" y="114" width="80" height="5" rx="1.5" fill="url(#goldGrad)" opacity="0.85"/>
  <rect x="28" y="119" width="92" height="5" rx="1.5" fill="url(#goldGrad)" opacity="0.6"/>

  <!-- Small circuit-node dots — hints at "OS" / tech -->
  <circle cx="22" cy="38" r="3" fill="#F0C040" opacity="0.7"/>
  <line x1="25" y1="38" x2="35" y2="50" stroke="#F0C040" stroke-width="1" opacity="0.4"/>
  <circle cx="126" cy="38" r="3" fill="#F0C040" opacity="0.7"/>
  <line x1="123" y1="38" x2="113" y2="50" stroke="#F0C040" stroke-width="1" opacity="0.4"/>
  <circle cx="22" cy="118" r="3" fill="#F0C040" opacity="0.5"/>
  <circle cx="126" cy="118" r="3" fill="#F0C040" opacity="0.5"/>


  <!-- ── WORDMARK ── -->
  <!-- "ECCLESIA" in Cinzel — stately, classical -->
  <text
    x="162"
    y="82"
    font-family="'Cinzel', 'Palatino Linotype', Georgia, serif"
    font-size="38"
    font-weight="700"
    letter-spacing="3"
    fill="#1B2E5E"
  >ECCLESIA</text>

  <!-- "OS" — same font, gold accent, slightly smaller -->
  <text
    x="162"
    y="82"
    font-family="'Cinzel', 'Palatino Linotype', Georgia, serif"
    font-size="38"
    font-weight="700"
    letter-spacing="3"
    fill="#1B2E5E"
  >
    <!-- invisible spacer to position OS after ECCLESIA -->
    <tspan fill="transparent">ECCLESIA</tspan><tspan fill="url(#goldGrad)" dx="2">OS</tspan>
  </text>

  <!-- Thin gold rule under wordmark -->
  <line x1="162" y1="92" x2="508" y2="92" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.7"/>

  <!-- Tagline -->
  <text
    x="162"
    y="118"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="13.5"
    font-weight="300"
    letter-spacing="2.5"
    fill="#5A6A8A"
  >PLATEFORME DE GESTION D'ÉGLISE</text>
</svg>
